<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1512">
<title>羽毛球打法测评 · 你的球像谁</title>
<style>
  :root{
    --bg:#0B1512; --bg2:#12211B; --panel:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.11); --ink:#EEF4EE; --muted:#93A79C;
    --lime:#C9F25B; --coral:#FF7A45; --gold:#FFC94A; --sky:#7ED7F0;
    --rose:#FF5A7A; --violet:#B49BFF; --mint:#8DE08D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 110% -12%, rgba(201,242,91,.10) 0%, transparent 55%),
      radial-gradient(800px 460px at -20% 108%, rgba(126,215,240,.08) 0%, transparent 60%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.62;
    touch-action:manipulation;
  }
  .app{max-width:480px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;}
  .screen{animation:in .3s ease both;}
  @keyframes in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .grow{flex:1;}
  .court{
    position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.5;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(600px 600px at 50% 20%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(600px 600px at 50% 20%, #000 0%, transparent 78%);
  }
  .tag{font-size:11px;letter-spacing:.22em;color:var(--muted);}

  /* 封面 */
  .cover{padding-top:5vh;display:flex;flex-direction:column;gap:14px;}
  .badge{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    padding:7px 13px;border-radius:99px;border:1px solid rgba(201,242,91,.34);
    background:rgba(201,242,91,.08);color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.04em;
  }
  h1{font-size:39px;line-height:1.16;margin:2px 0 0;font-weight:900;letter-spacing:-.03em;}
  h1 em{font-style:normal;color:var(--lime);}
  .sub{color:var(--muted);font-size:14.5px;margin:0;max-width:24em;}
  .dims{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
    font-size:12px;background:var(--panel);border:1px solid var(--line);color:#D7E2D8;
  }
  .chip i{width:7px;height:7px;border-radius:50%;display:block;}
  .facts{display:flex;gap:22px;margin:6px 0 0;}
  .facts b{font-size:22px;font-weight:900;letter-spacing:-.02em;}
  .facts span{display:block;color:var(--muted);font-size:11px;margin-top:-2px;}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:17px;border-radius:16px;background:var(--lime);color:#0B1512;
    font-weight:900;font-size:16.5px;letter-spacing:.01em;
    transition:transform .12s ease,filter .2s;box-shadow:0 10px 28px rgba(201,242,91,.16);
  }
  .btn:active{transform:scale(.985);filter:brightness(.95);}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:700;}
  .hint{text-align:center;color:var(--muted);font-size:11.5px;margin:10px 0 0;}

  /* 答题 */
  .quizbar{position:sticky;top:0;z-index:5;padding:8px 0 10px;background:linear-gradient(180deg,rgba(11,21,18,.96),rgba(11,21,18,0));backdrop-filter:blur(6px);}
  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .back{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:15px;}
  .back:disabled{opacity:.3;}
  .qmeta{flex:1;display:flex;flex-direction:column;gap:5px;}
  .qmeta .row{display:flex;justify-content:space-between;align-items:baseline;}
  .qcat{font-size:12px;font-weight:800;letter-spacing:.04em;}
  .qcount{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .track{height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;}
  .track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--lime),#8DE08D);transition:width .3s ease;}
  .qcard{margin-top:16px;}
  .qnum{font-size:11px;color:var(--muted);letter-spacing:.18em;font-weight:700;}
  .question{font-size:24px;font-weight:800;line-height:1.5;margin:8px 0 20px;letter-spacing:-.015em;}
  .options{display:flex;flex-direction:column;gap:9px;}
  .opt{
    display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
    padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    font-size:15px;transition:all .14s ease;
  }
  .opt:active{transform:scale(.992);}
  .opt.on{border-color:var(--lime);background:rgba(201,242,91,.13);}
  .opt .dot{width:18px;height:18px;border-radius:50%;border:1.6px solid rgba(255,255,255,.25);flex:none;position:relative;}
  .opt.on .dot{border-color:var(--lime);}
  .opt.on .dot::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--lime);}
  .scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:9px;padding:0 3px;}
  .livewrap{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .livewrap .cap{font-size:9.5px;letter-spacing:.2em;color:var(--muted);opacity:.85;}
  .livewrap svg{width:min(74vw,246px);height:auto;display:block;}
  .livewrap .cap2{font-size:10px;color:rgba(147,167,156,.6);}

  /* 结果 */
  .hero{background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;}
  .hero .art{width:112px;height:112px;flex:none;border-radius:16px;overflow:hidden;background:#08110E;border:1px solid var(--line);}
  .hero .art svg{display:block;width:100%;height:100%;}
  .art img,.mini img{display:block;width:100%;height:100%;object-fit:cover;}
  .hero .info{flex:1;min-width:0;}
  .hero .muted{color:var(--muted);font-size:12px;}
  .hero h2{margin:2px 0 2px;font-size:25px;font-weight:900;letter-spacing:-.02em;}
  .hero .nick{color:var(--muted);font-size:12.5px;}
  .simline{display:flex;align-items:baseline;gap:6px;margin-top:7px;}
  .simline b{font-size:26px;font-weight:900;color:var(--lime);letter-spacing:-.03em;}
  .simline span{font-size:11.5px;color:var(--muted);}
  .stylechip{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.03em;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px;}
  .card h3{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.05em;color:#DCE7DB;}
  .radar{width:100%;max-width:300px;margin:0 auto;display:block;}
  .legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--muted);margin-top:2px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:14px;height:3px;border-radius:2px;display:block;}
  .bars{display:flex;flex-direction:column;gap:11px;}
  .dimlist{display:flex;flex-direction:column;gap:14px;}
  .dimrow{display:flex;flex-direction:column;gap:5px;}
  .dimhead{display:flex;align-items:center;gap:9px;}
  .dname{font-size:14px;font-weight:800;}
  .gchip{font-size:10.5px;font-weight:800;padding:2.5px 9px;border-radius:99px;letter-spacing:.04em;}
  .dband{font-size:12.5px;color:#B9C6B9;line-height:1.66;margin:0;}
  .brow{display:grid;grid-template-columns:56px 1fr 68px;gap:9px;align-items:center;}
  .bname{font-size:12.5px;font-weight:700;}
  .btrack{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bfill{height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .bval{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}
  .para{font-size:14px;line-height:1.8;margin:0;color:#D9E3D8;}
  .kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
  .kv span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#D7E2D8;}
  .weak{margin-top:10px;font-size:12.5px;color:var(--muted);}
  .top3{display:flex;flex-direction:column;gap:9px;}
  .t3{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line);}
  .t3 .mini{width:42px;height:42px;border-radius:11px;overflow:hidden;flex:none;background:#08110E;}
  .t3 .mini svg{display:block;width:100%;height:100%;}
  .t3 .tn{flex:1;font-size:13.5px;font-weight:700;}
  .t3 .tn small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px;}
  .t3 .pct{font-size:15px;font-weight:900;color:var(--lime);font-variant-numeric:tabular-nums;}
  .racket{display:flex;gap:11px;padding:12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:9px;}
  .racket:last-child{margin-bottom:0;}
  .rbrand{flex:none;width:50px;font-size:9.5px;font-weight:900;letter-spacing:.05em;color:var(--muted);text-align:center;padding-top:3px;line-height:1.4;}
  .rmodel{font-size:14.5px;font-weight:800;}
  .rmodel span{color:var(--lime);font-size:10.5px;margin-left:6px;font-weight:700;}
  .rwhy{font-size:12.5px;color:var(--muted);margin:3px 0 0;line-height:1.62;}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .gcard{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:8px;display:flex;gap:8px;align-items:center;}
  .gcard .art{width:40px;height:40px;border-radius:9px;overflow:hidden;flex:none;background:#08110E;}
  .gcard .art svg{display:block;width:100%;height:100%;}
  .gcard b{display:block;font-size:12px;}
  .gcard small{color:var(--muted);font-size:10px;}
  .actions{display:flex;gap:9px;margin-top:14px;}
  .actions .btn{font-size:15px;padding:15px;}
  .footnote{color:var(--muted);font-size:11px;text-align:center;margin:16px 0 0;}
  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
    background:#EEF4EE;color:#0B1512;padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:700;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:9;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<div class="court"></div>
<main class="app" id="app"></main>

m":"tech","reverse":false,"text":"对手回我中场球，我能把球按到他后场角"},{"id":32,"dim":"tech","reverse":true,"text":"我控不好网前小球，常被对手直接扑死"},{"id":33,"dim":"tech","reverse":false,"text":"吊球和杀球，我起手动作能做得一样"},{"id":34,"dim":"tech","reverse":false,"text":"对手站位靠前，我能用滑板骗他往后退"},{"id":35,"dim":"tech","reverse":false,"text":"网前球我能轻轻一碰，让它刚过网就掉"},{"id":36,"dim":"tech","reverse":true,"text":"我打不出反手高远球，只能被迫挑起来"},{"id":37,"dim":"tech","reverse":true,"text":"拉高远球时，我的落点忽深忽浅"},{"id":38,"dim":"tech","reverse":false,"text":"对手压我反手，我可以变线打到对角"},{"id":39,"dim":"tech","reverse":false,"text":"接发球时，我能用假动作晃到对手"},{"id":40,"dim":"tech","reverse":true,"text":"不管来什么球，我大多只能回同一种球"},{"id":41,"dim":"tech","reverse":false,"text":"前场高点我不只会搓，还能抹、推、勾做出变化"},{"id":42,"dim":"tech","reverse":false,"text":"被动挑球时，我能用手指二次发力把球顶到底线"},{"id":43,"dim":"tech","reverse":false,"text":"后场劈吊、滑板、点杀，我用同一个起手动作"},{"id":44,"dim":"tech","reverse":false,"text":"网前搓球能搓到贴网，让对手只能挑起来"},{"id":45,"dim":"tech","reverse":true,"text":"网前小球我基本靠碰，搓不出贴网"},{"id":46,"dim":"attack","reverse":false,"text":"对方挑球不到位，我能一板杀下去"},{"id":47,"dim":"attack","reverse":false,"text":"杀完一板，我还能上网扑第二板"},{"id":48,"dim":"attack","reverse":true,"text":"球来了我基本都回高远球，很少下压"},{"id":49,"dim":"attack","reverse":false,"text":"起跳杀球时，我能把球压到边线附近"},{"id":50,"dim":"attack","reverse":true,"text":"我杀出去的球，对手常常轻松挡回"},{"id":51,"dim":"attack","reverse":true,"text":"连续杀三拍，我的球一板比一板软"},{"id":52,"dim":"attack","reverse":false,"text":"对手站位靠后，我会突然轻杀他的身前"},{"id":53,"dim":"attack","reverse":false,"text":"对方挡网没挡远，我能一步扑死"},{"id":54,"dim":"attack","reverse":true,"text":"我的杀球常常直接杀出界"},{"id":55,"dim":"attack","reverse":false,"text":"对手退到后场，我会用重杀和劈杀换着打"},{"id":56,"dim":"attack","reverse":false,"text":"我能杀吊结合，让对手不敢提前退后场"},{"id":57,"dim":"attack","reverse":false,"text":"起跳杀球时，我能抢到最高点击球"},{"id":58,"dim":"attack","reverse":false,"text":"连续进攻时，我会盯对手回球质量决定杀还是点"},{"id":59,"dim":"attack","reverse":false,"text":"我能用对角劈杀把对手重心拉出场外"},{"id":60,"dim":"attack","reverse":true,"text":"我的杀球威胁不大，对手不怕退后场"},{"id":61,"dim":"tact","reve   var COPY = {"band":{"phys":{"S":"后场杀球落地就能接下一拍，多拍相持后蹬地照样有力，第三局速度也不掉。核心和下肢能把力量持续送上来，这是同龄人里少见的下限。建议力量课之外加 4×30 秒多球间歇冲刺，把体能转化到场上。","A":"点杀有速度，起跳落地也不发虚，但连打十拍以上杀球质量会往下掉。第三局跑动变沉，说明体能够用但不耐用。建议每周两次 20 分钟深蹲跳加跳绳循环，练完马上打多球。","B":"半场对拉还行，一旦被拉长回合就靠手臂硬救，起跳杀完落地回位慢半拍。发力更多来自手臂而不是蹬地转体，所以越打越吃力。建议先练原地蹬转发力和落地缓冲，每次 3 组 10 次。","C":"多拍后动作容易散，杀球基本靠手臂抡，腰腹没参与进来，两局下来喘得说不出话。身体基础还不支持你打连续高强度。建议每周两次快走加徒手深蹲、平板支撑，先把基础量堆起来。","D":"打一局就腿软，跳杀落地自己都站不稳，杀球全靠手甩。这不是技术问题，而是身体底子还没打起来。建议先做靠墙静蹲、提踵和快走，每次 15 分钟，坚持两周再上场打多球。"},"foot":{"S":"对方吊球你能两步上网，杀球后一步回中，交叉步上网也不打结。启动第一步快、重心稳，是全场覆盖的底子。建议加练多球随机落点，练判断的同时保持步频，别只练固定米字步。","A":"常规米字步够用，被动球能救到但上网偏慢半拍，退后场有时会乱成并步。说明启动第一步和交叉步的衔接还不稳。建议每周两次绳梯加多球对角吊上网，专练回中的第一步。","B":"主动球能跑到位，被动吊球常常够不着，杀球后回中总慢一点。问题在脚踝接地不硬，蹬不回来。建议练单脚提踵和低重心左右滑步，每次 3 组 20 秒，再配合多球固定点回中。","C":"经常一步到位就定住，球一变向就要二次调整；上网后忘了回中，后场空一大片。这是启动和回中都没形成习惯。建议先用无球米字步把回中固定下来，每天 5 组，再进有球练习。","D":"站着等球打，球一拉开就靠手臂去够，打完不知道自己该站哪。基础站位和回中意识都还没建立。建议先学原地小碎步和垫步回中，对着墙练 5 分钟，再让人喂固定两点跑动。"},"tech":{"S":"网前搓球能搓到贴网，勾对角能把人拉开，后场劈吊能让对手提前起跳。手腕刚性和拍面控制都到位，手指还能二次发力。建议多球里混入被动低位球，练被压时也能贴网回球。","A":"搓放基本贴网，勾对角偶尔会出界，杀球落点够用但变化不多。拍面控制和二次发力刚成型，还不太敢在被动时用手指补力。建议每天 100 拍网前固定点搓放，加 20 拍反手过渡。","B":"网前能搓能放，但节奏一快就冒高被扑，挑球常常只到半场。说明手腕刚性不够，拍面在触球瞬间会晃。建议先练固定点搓放 50 次找手感，再练手指发力的正手勾对角。","C":"搓球经常过高，放网忽远忽近，后场吊球质量靠蒙，被人一逼就挑高。拍面控制还没成型。建议从贴网搓放的原地练习开始，每天 100 次只求过网贴网，先把手腕定住。","D":"网前基本靠碰，搓放要么下网要么冒高被扑，拍面角度完全靠感觉。需要从握拍和拍面认起。建议先练握拍转换和正手贴网定点挡球，每次 100 个，先保证过网质量。"},"attack":{"S":"后场起跳重杀能压到边线，点杀突然，杀完还能连贯上网。击球点高、下压角度刁，杀吊结合让人不敢提前退。建议保持进攻威胁的同时加练防守反击，别把每分都压在重杀上。","A":"重杀有威胁，落点偏中路，吊球能吊起来但和杀球动作不够一致，对手容易提前判断。击球点还行，下压角度偏平。建议练杀吊同一引拍，每天 30 个杀球配 30 个吊球交替出手。","B":"能杀但压不住，球常被挡回中场，想吊又吊不贴网，杀吊结合基本没有。问题在击球点偏低，下压角度不够。建议先练高点位的原地杀球，再逐步加入吊球。","C":"杀球发不出力，经常杀到自己往前冲，下压靠手腕硬压，容易被反抽。击球点很低。建议先固定原地顶点击球点，把挥拍轨迹拉直，每次 20 个定点杀球，先求过网下压。","D":"基本不杀球，偶尔抡一拍也常下网，后场只能靠高远球顶回去。缺少进攻手段。建议先练正手高远球的鞭打发力，20 个一组，能稳定压到底线后再尝试半场杀球。"},"tact":{"S":"能看出对手回球的空档，主动抓过渡球，用控底线把人压在身后。节奏变化和落点组合成体系，知道这一分要打哪。建议保持，同时复盘被逆转的局，找自己习惯性上头的时刻。","A":"会拉吊调动，也能抓对手的过渡球，但被快节奏压住时会退回凭感觉打。落点组合偏单一。建议每局给自己定两条固定套路，比如先压反手再抓直线，打完复盘执行率。","B":"知道要调动对手，实战里常打成你来我往的对抽，控底线不稳，回球容易过半场。缺少主动设计的一分。建议先练两点拉吊固定套路，再要求自己每分前想好下一拍落点。","C":"基本是打到哪算哪，对方一变线就跟不上节奏，回球质量靠对方失误。没有落点组合的概念。建议从每局只定一个目标开始，比如把球压到对手反手底线，坚持一整局。","D":"上场就是互相抡，球来了凭本能回，从不考虑下一拍。战术意识还没开始建立。建议先学会看对手站位再出手，每次打球只记一件事：他站哪，我就打另一边。"},"mental":{"S":"关键分敢要球，落后也不慌，失误后下一拍立刻复位。专注能撑满三局，情绪波动很小。建议继续保持，同时多打落后 5 分以上的模拟局，别让顺风球掩盖问题。","A":"大部分时候稳，关键分偶尔手紧，失误后要一两球才能回来。专注时长能覆盖两局。建议练 5 分钟固定发球节奏，再加打 11 分制的落后模拟局，专门练关键分处理。","B":"领先时打得开，一到 18 平就缩手，失误后会连着送两三分。失误后复位慢，情绪几乎写在脸上。建议先练失误后的固定动作，擦汗、看拍线、深呼吸，再打关键分模拟。","C":"比分一紧就发虚，失误后容易连续丢分，被对手连着得分时想放弃。专注大概只有一局。建议从 11 分制小局开始，每分给自己一个动作指令，把注意力从比分拉回下一拍。","D":"打球容易上头，一失误就骂自己或者干脆乱打，落后就提不起劲。情绪完全接管了比赛。建议先把目标降到一条：每球都认真发球，用固定呼吸节奏帮自己在失误后复位。"}},"analysis":{"phys":"身体维度的核心是鞭打链条：从蹬地、转髋、转体到肩肘腕依次加速，核心传导决定力量能不能送进拍头；变向制动则看你急停后能不能立刻再启动，这也是多拍后半段质量的分水岭。","foot":"步法不是跑得快，而是启动第一步快、回位快：击球后快速回中决定你下一拍的准备时间，脚踝刚性影响蹬地传力和急停稳定，交叉步则负责覆盖大对角和后场底线。","tech":"手法看两件事：拍面控制决定球去哪，手腕刚性决定球有多稳。触球瞬间手指的二次发力能把被动球救成主动，前场贴网搓放则是最能体现手感的一项，搓得贴网才有下一拍进攻。","attack":"进攻效率取决于击球点高度：点抢得高，下压角度才能压到边线；杀吊结合是让对手不敢提前退的关键，同一引拍打出两种球路，对手的重心才会被钉在原地。","tact":"战术是把一分拆成设计：控底线把对手压在身后，抓过渡球抢半场主动，靠节奏变化和落点组合逼出高质量回球。真正的高手不是每拍都发力，而是让对手每拍都不舒服。","mental":"心理层面的差距常在关键分处理：敢不敢要球、落后时能不能守住一分一分追；失误后复位快的人，下一拍还能执行战术，比赛专注时长则决定你在第三局还剩多少判断力。"},"combo":{"play":{"高攻":"进攻和身体是强项，就打得直接一点：后场抢高点杀吊结合，前场用推扑压住对手，争取 6 拍内结束一分。注意别每球都硬冲，杀完记得回中，防止被对手用平高球拖进长回合。","高控":"手法和战术强，就把比赛拖进你的节奏：拉吊四方球控底线，抓对手过渡球抢主动，用贴网搓放逼他起高球。注意落点要压深，别为了求变线把自己先打失误。","高防":"步法和意志强，就打得耐心一点：接杀挡网后快速回中，用对角拉吊把对手跑动拉长，等他先失误。注意防守不是被动挨打，救起球后要主动抢网，否则容易被连续下压打死。","均衡":"六维没有明显短板，最适合用套路球：发接发抢主动，前场吊后场压交替使用，用落点组合慢慢磨出机会。注意别样样都会却样样不精，挑两套最有把握的套路练到熟。"},"train":{"phys":"最弱时先练下肢和核心：每周两次深蹲、跳绳、平板支撑循环 3 组，再打 4×30 秒全速多球间歇，让心肺能跟上连续起跳。","foot":"最弱时练米字步和绳梯：无球米字步 5 组×2 分钟，绳梯练启动第一步，再上多球对角吊上网，强制每拍打完回中一步。","tech":"最弱时练固定点搓放：球桶摆在网边，正反手贴网搓 100 个只求贴网，再练手指二次发力和反手过渡，每天 15 分钟。","attack":"最弱时先固定击球点：原地顶点击球 20 个一组练高点下压，再加半场杀球和杀吊交替 30 拍，最后练杀完上网连贯。","tact":"最弱时练固定套路：两点拉吊压反手底线、抓过渡球抢网，每局只执行一套，打完记执行成功率，再换第二套。","mental":"最弱时练关键分模拟：直接打 11 分制小局从 9:9 开打，失误后固定做擦汗、深呼吸、看拍线三个动作再发球，每局复盘一次。"}}};

  /* ---------- 答题页实时六维雷达 ---------- */
  var live = { vals: null, raf: null };

  // 实时雷达 =「当前水平」：只对已答的题取平均；还没答到的维度先按中间值 50 占位
  function liveScores() {
    var sums = {}, counts = {};
    DIMS.forEach(function(d){ sums[d.key] = 0; counts[d.key] = 0; });
    QUESTIONS.forEach(function(q, i){
      var v = state.answers[i];
      if (v == null) return;
      var val = q.reverse ? (6 - v) : v;
      sums[q.dim] += val - 1;
      counts[q.dim] += 1;
    });
    return DIMS.map(function(d){
      // 答不满 3 题先按中间值 50 占位，避免单题就把形状拉到 0 或 100
      if (counts[d.key] < 3) return 50;
      return Math.max(0, Math.min(100, Math.round((sums[d.key] / (counts[d.key] * 4)) * 100)));
    });
  }

  function livePoints(vals) {
    var cx = 120, cy = 102, R = 60;
    return vals.map(function(v, i){
      var a = -Math.PI / 2 + i * 2 * Math.PI / 6;
      var r = R * (0.10 + 0.90 * (v / 100));
      return (cx + Math.cos(a) * r).toFixed(1) + "," + (cy + Math.sin(a) * r).toFixed(1);
    }).join(" ");
  }

  function liveRadarSVG(vals, curKey) {
    var cx = 120, cy = 102, R = 60, N = 6;
    function pt(i, ratio) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / N;
      return [cx + Math.cos(a) * R * ratio, cy + Math.sin(a) * R * ratio];
    }
    var rings = [0.25, 0.5, 0.75, 1].map(function(r){
      var arr = [];
      for (var i = 0; i < N; i++) { var p = pt(i, r); arr.push(p[0].toFixed(1) + "," + p[1].toFixed(1)); }
      return '<polygon points="' + arr.join(" ") + '" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1"/>';
    }).join("");
    var spokes = "", labels = "";
    for (var i = 0; i < N; i++) {
      var p = pt(i, 1);
      spokes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';
      var d = DIMS[i];
      var lp = pt(i, 1.22);
      var anchor = Math.abs(lp[0] - cx) < 8 ? "middle" : (lp[0] > cx ? "start" : "end");
      var active = curKey === d.key;
      labels += '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3.5).toFixed(1)+'" text-anchor="'+anchor+'" font-size="9.5" fill="'+(active?d.color:'#6E8177')+'" font-weight="'+(active?'800':'500')+'">'+d.name+'</text>';
    }
    var pts = livePoints(vals).split(" "), dots = "";
    for (var j = 0; j < N; j++) {
      var xy = pts[j].split(",");
      dots += '<circle id="liveDot'+j+'" cx="'+xy[0]+'" cy="'+xy[1]+'" r="2.6" fill="'+DIMS[j].color+'"/>';
    }
    return '<svg viewBox="0 0 240 196" role="img" aria-label="实时六维雷达">' +
      rings + spokes +
      '<polygon id="livePoly" points="' + livePoints(vals) + '" fill="rgba(201,242,91,.13)" stroke="#C9F25B" stroke-width="1.8" stroke-linejoin="round"/>' +
      dots + labels + '</svg>';
  }

  function mountLive() {
    var host = document.getElementById("live");
    if (!host) return;
    var target = liveScores();
    var curKey = QUESTIONS[state.idx] ? QUESTIONS[state.idx].dim : "";
    host.innerHTML = liveRadarSVG(target, curKey);
    var poly = document.getElementById("livePoly");
    var from = live.vals ? live.vals.slice() : [0, 0, 0, 0, 0, 0];
    if (live.raf && typeof cancelAnimationFrame === "function") cancelAnimationFrame(live.raf);
    var start = null, dur = 300;
    function frame(ts) {
      var now = (typeof ts === "number") ? ts : Date.now();
      if (start == null) start = now;
      var k = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      var cur = from.map(function(f, i){ return f + (target[i] - f) * e; });
      if (poly && poly.setAttribute) poly.setAttribute("points", livePoints(cur));
      var pts = livePoints(cur).split(" ");
      for (var j = 0; j < 6; j++) {
        var el = document.getElementById("liveDot" + j);
        if (el && el.setAttribute) {
          var xy = pts[j].split(",");
          el.setAttribute("cx", xy[0]); el.setAttribute("cy", xy[1]);
        }
      }
      if (k < 1) { live.raf = requestAnimationFrame(frame); }
      else { live.vals = target; live.raf = null; }
    }
    live.vals = target;
    requestAnimationFrame(frame);
  }

  /* ---------- 答题 ---------- */
  function renderQuiz() {
    var q = QUESTIONS[state.idx];
    var dim = DIMS.filter(function(d){ return d.key === q.dim; })[0] || DIMS[0];
    var dimStart = 0, dimTotal = 0;

        '<div class="grow"></div>' +
      '</section>';

    // 防止连点：一题只接受一次选择，跳转过程中忽略后续点击
    var opts = app.querySelectorAll(".opt");
    Array.prototype.forEach.call(opts, function(el){
      el.addEventListener("click", function(){

          state.lock = false;

  /* ---------- 计分 ---------- */
  function score() {
    var sums = {}, counts = {};
    DIMS.forEach(function(d){ sums[d.key] = 0; counts[d.key] = 0; });
    QUESTIONS.forEach(function(q, i){
      var v = state.answers[i] || 3;
      var val = q.reverse ? (6 - v) : v;      // 1..5
      sums[q.dim] += val - 1;                  // 0..4
      counts[q.dim] += 1;
    });
    return DIMS.map(function(d){
      var max = counts[d.key] * 4;
      return { dim: d, pct: max ? Math.round((sums[d.key] / max) * 100) : 50 };
    });
  }

  // 打法形状匹配：先把六维各自减去自己的平均分（去掉整体水平高低），再比距离，
  // 这样「水平一般但打法像李梓嘉」也能匹配到李梓嘉，不会被绝对分数带偏。
  function center(v) {
    var m = 0, i;
    for (i = 0; i < v.length; i++) m += v[i];
    m = m / v.length;
    return v.map(function(x){ return x - m; });
  }
  function shapeDist(ca, cb) {
    var s = 0;
    for (var i = 0; i < ca.length; i++) s += Math.pow(ca[i] - cb[i], 2);
    return Math.sqrt(s / ca.length);
  }

  function rankStars(user) {
    var cu = center(user);
    var arr = STARS.map(function(st){
      var vec = center(DIMS.map(function(d){ return st.scores[d.key]; }));
      return { star: st, dist: shapeDist(cu, vec) };
    }).sort(function(a,b){ return a.dist - b.dist; });

    // 相对相似度：第一名按真实接近度标定，其余按「和第一名的差距」线性拉到 45% 左右，
    // 这样 10 位之间差距看得清楚，不会被绝对距离挤成一片。
    var d0 = arr[0].dist;
    var dLast = arr[arr.length - 1].dist;
    var top = Math.max(90, Math.min(99, Math.round(100 - d0 * 0.9)));
    var span = Math.max(0.001, dLast - d0);
    arr.forEach(function(x, i){
      if (i === 0) { x.sim = top; return; }
      var ratio = (x.dist - d0) / span;              // 0..1
      x.sim = Math.max(41, Math.min(top - 1, Math.round(top - ratio * (top - 45))));
    });
    return arr;
  }

  function styleName(ordered) {
    var a = ordered[0].dim.key, b = ordered[1].dim.key;
    return STYLE2[a + "|" + b] || STYLE2[b + "|" + a] || "均衡全面型";
  }

  function level(pct) {
    if (pct >= 75) return "强项";
    if (pct >= 60) return "不错";
    if (pct >= 40) return "中游";
    return "可提升";
  }
  function verdict(d, pct) { return pct >= 75 ? d.high : (pct >= 40 ? d.mid : d.low); }

  function radarSVG(user, starScores, starColor, grades) {
    var cx = 142, cy = 120, R = 82, N = DIMS.length;
    function pt(i, ratio) {
      var a = -Math.PI / 2 + (i * 2 * Math.PI) / N;
      return [cx + Math.cos(a) * R * ratio, cy + Math.sin(a) * R * ratio];
    }
    function polyFor(vals) {
      return vals.map(function(v, i){
        var p = pt(i, 0.16 + 0.84 * (v / 100));
        return p[0].toFixed(1) + "," + p[1].toFixed(1);
      }).join(" ");
    }
    var rings = [0.25, 0.5, 0.75, 1].map(function(r){
      var arr = [];
      for (var i = 0; i < N; i++) { var p = pt(i, r); arr.push(p[0].toFixed(1) + "," + p[1].toFixed(1)); }
      return '<polygon points="' + arr.join(" ") + '" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/>';
    }).join("");
    var spokes = "";
    for (var i = 0; i < N; i++) {
      var p = pt(i, 1);
      spokes += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(255,255,255,.09)" stroke-width="1"/>';
    }
    var labels = DIMS.map(function(d, i){
      var p = pt(i, 1.15);
      var anchor = Math.abs(p[0] - cx) < 8 ? "middle" : (p[0] > cx ? "start" : "end");
      var gtxt = grades ? grades[i].key : "";
      return '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="'+anchor+'" font-size="10.5" fill="#93A79C">'+d.name+(gtxt?' '+gtxt:'')+'</text>';
    }).join("");
    var userVals = user.map(function(u){ return u.pct; });
    var dots = user.map(function(u, i){
      var p = pt(i, 0.16 + 0.84 * (u.pct / 100));
      return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#C9F25B"/>';
    }).join("");
    return '<svg class="radar" viewBox="0 0 284 250" role="img" aria-label="能力雷达图">' +
      rings + spokes +
      (starScores ? '<polygon points="'+polyFor(starScores)+'" fill="'+starColor+'18" stroke="'+starColor+'" stroke-width="1.6" stroke-dasharray="4 4"/>' : '') +
      '<polygon points="'+polyFor(userVals)+'" fill="rgba(201,242,91,.16)" stroke="#C9F25B" stroke-width="2" stroke-linejoin="round"/>' +
      dots + labels +
      '</svg>';
  }

  /* ---------- 结果 ---------- */

  function isTroll() {
    var allOne = true, allFive = true, i;
    for (i = 0; i < QUESTIONS.length; i++) {
      if (state.answers[i] !== 1) allOne = false;
      if (state.answers[i] !== 5) allFive = false;
    }
    return allOne ? "one" : (allFive ? "five" : "");
  }

  function renderTease(kind) {
    var msg = kind === "five"
      ? (QUESTIONS.length + " 题全选「非常符合」，这数据太完美了——<br>要不重来一遍，按真实情况答？")
      : (QUESTIONS.length + " 题全选「很不符合」，这组合有点离谱——<br>要不重来一遍，认真点答？");
    var punch = kind === "five" ? "你确定？" : "你会打吗";
    app.innerHTML =
      '<section class="screen" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:72vh;gap:6px">' +
        '<div style="font-size:66px;line-height:1.1;animation:in .35s ease both">😅</div>' +
        '<h1 style="font-size:36px;margin:6px 0 0">' + punch + '</h1>' +
        '<p class="sub" style="text-align:center;margin-top:8px">' + msg + '</p>' +
        '<button class="btn" id="retry" style="margin-top:18px">重新测一次</button>' +
        '<button class="btn ghost" id="force" style="margin-top:10px;width:auto;padding:12px 18px;font-size:13px">我是认真的，还是要看结果</button>' +
        '<p class="footnote" style="margin-top:16px">全选同一个选项的话，测出来也只会是最基础的那一档</p>' +
      '</section>';
    document.getElementById("retry").addEventListener("click", function(){
      state = { idx: 0, answers: new Array(QUESTIONS.length).fill(null), lock: false, timer: null };
      renderCover();
    });
    document.getElementById("force").addEventListener("click", function(){
      renderResultForce();
    });
  }

  function renderResultForce() {
    state._force = true;
    renderResult();
    state._force = false;
  }

  function renderResult(isShared) {
    if (isShared) state._force = true;
    var troll = isTroll();
    if (troll && !state._force) { renderTease(troll); return; }
    var scores = score();
    var ordered = scores.slice().sort(function(a,b){ return b.pct - a.pct; });
    var ranked = rankStars(scores.map(function(s){ return s.pct; }));
    var best = ranked[0], second = ranked[1], third = ranked[2];
    var st = best.star;
    var sname = styleName(ordered);
    var gradesArr = scores.map(function(sc){ return gradeOf(sc.pct); });
    scores.forEach(function(sc, i){ sc.grade = gradesArr[i]; });
    function bandText(dimKey, gKey) {
      var b = COPY.band && COPY.band[dimKey];
      var t = b && b[gKey];
      return t || (gKey + " 档：这个维度还在基础阶段，先把动作固定下来再谈变化。");
    }
    function analysisText(dimKey) {
      return (COPY.analysis && COPY.analysis[dimKey]) || "这个维度的技术细节还需要多看多练。";
    }
    var top2keys = ordered.slice(0, 2).map(function(o){ return o.dim.key; });
    var playKey = (top2keys.indexOf("attack") >= 0 || top2keys.indexOf("phys") >= 0) ? "高攻"
                : ((top2keys.indexOf("tech") >= 0 || top2keys.indexOf("tact") >= 0) ? "高控"
                : ((top2keys.indexOf("foot") >= 0 || top2keys.indexOf("mental") >= 0) ? "高防" : "均衡"));
    var playText = (COPY.combo && COPY.combo.play && COPY.combo.play[playKey]) || "";
    var lowDim = ordered[ordered.length - 1].dim;
    var lowDim2 = ordered[ordered.length - 2].dim;
    var trainText = (COPY.combo && COPY.combo.train && COPY.combo.train[lowDim.key]) || "";
    var analysisDims = [ordered[0].dim, ordered[1].dim, lowDim];
    var starVec = DIMS.map(function(d){ return st.scores[d.key]; });
    var top2 = ordered.slice(0,2).map(function(o){ return o.dim.name; }).join(" + ");
    var gap = ordered[0].pct - ordered[ordered.length-1].pct;

    var summary = "你的球风是「" + sname + "」：" + ordered[0].dim.name + "和" + ordered[1].dim.name + "最突出，"
      + ordered[ordered.length-1].dim.name + "是相对短板。"
      + "把 10 位名将的打法放进同一张能力表里对照，最接近的是" + st.name + "（" + st.nickname + "），相似度 " + best.sim + "%。";

    app.innerHTML =
      '<section class="screen">' +
        (isShared ?
          '<div class="card" style="margin-top:0;margin-bottom:12px;border-color:rgba(201,242,91,.35);background:rgba(201,242,91,.07)">' +
            '<b style="color:var(--lime);font-size:13px">朋友分享给你的测评结果</b>' +
            '<p class="para" style="margin:6px 0 0;font-size:13px">TA 最像 <b>' + esc(st.name) + '</b>（' + esc(st.nickname) + '）· 相似度 ' + best.sim + '%</p>' +
          '</div>' : '') +
        '<div class="tag" style="margin-bottom:8px">' + (isShared ? 'TA 的测评结果' : '你的测评结果') + '</div>' +
        '<div class="hero">' +
          starArt(st, 112) +
          '<div class="info">' +
            '<div class="muted">最像的球星</div>' +
            '<h2>' + esc(st.name) + '</h2>' +
            '<div class="nick">' + esc(st.nickname) + ' · ' + esc(st.country) + ' · ' + esc(st.years) + '</div>' +
            '<div class="simline"><b>' + best.sim + '%</b><span>打法相似度</span></div>' +
            '<span class="stylechip" style="background:' + st.color + '26;color:' + st.color + ';border:1px solid ' + st.color + '55">' + esc(st.style) + '</span>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<h3>能力雷达 · 你 vs ' + esc(st.name) + '</h3>' +
          radarSVG(scores, starVec, st.color, gradesArr) +
          '<div class="legend"><span><i style="background:#C9F25B"></i>你</span><span><i style="background:' + st.color + '"></i>' + esc(st.name) + '</span></div>' +
          '<p class="footnote" style="margin-top:8px">相似度＝相对接近度：第一名按真实接近度标定，其余按差距递减，差异看得更清楚</p>' +
        '</div>' +

        '<div class="card">' +
          '<h3>六维档案</h3>' +
          '<div class="dimlist">' + scores.map(function(sc){
            var g = sc.grade;
            return '<div class="dimrow">' +
              '<div class="dimhead">' +
                '<span class="dname" style="color:' + sc.dim.color + '">' + sc.dim.name + '</span>' +
                '<span class="gchip" style="background:' + g.color + '1f;color:' + g.color + ';border:1px solid ' + g.color + '55">' + g.key + ' · ' + g.label + '</span>' +
              '</div>' +
              '<p class="dband">' + esc(bandText(sc.dim.key, g.key)) + '</p>' +
            '</div>';
          }).join("") + '</div>' +
        '</div>' +

        '<div class="card">' +
          '<h3>你的打法</h3>' +
          '<p class="para">' + esc(summary) + '</p>' +
          (playText ? '<p class="para" style="margin-top:9px">' + esc(playText) + '</p>' : '') +
          '<p class="para" style="margin-top:9px">' + esc(st.name) + '：' + esc(st.intro) + '</p>' +
          '<div class="kv">' + st.strengths.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join("") +
            '<span>招牌：' + esc(st.signature) + '</span></div>' +
          '<div class="weak">可以对照补的短板：' + esc(st.weakness) + '</div>' +
        '</div>' +

        '<div class="card">' +
          '<h3>技术解析</h3>' + analysisDims.map(function(d){
            return '<p class="para" style="margin:0 0 10px"><b style="color:' + d.color + '">' + d.name + '　</b>' + esc(analysisText(d.key)) + '</p>';
          }).join("") +
        '</div>' +

        '<div class="card">' +
          '<h3>加练建议</h3>' +
          '<p class="para" style="margin:0 0 9px"><b style="color:' + lowDim.color + '">优先补 ' + lowDim.name + '　</b>' + esc(trainText) + '</p>' +
          '<p class="para" style="margin:0"><b style="color:' + lowDim2.color + '">其次 ' + lowDim2.name + '　</b>' + esc((COPY.combo && COPY.combo.train && COPY.combo.train[lowDim2.key]) || '可以先保持现状，把精力放在短板上。') + '</p>' +
        '</div>' +

        '<div class="card">' +
          '<h3>你可能也像</h3>' +
          '<div class="top3">' + [best, second, third].map(function(r, i){
            return '<div class="t3">' +
              '<div class="mini">' + innerArt(r.star, "m") + '</div>' +
              '<div class="tn">' + esc(r.star.name) + (i === 0 ? ' <span style="color:#C9F25B;font-size:11px">最佳匹配</span>' : '') +
                '<small>' + esc(r.star.style) + ' · ' + esc(r.star.signature) + '</small></div>' +
              '<div class="pct">' + r.sim + '%</div>' +
            '</div>';
          }).join("") + '</div>' +
        '</div>' +

        (st.rackets && st.rackets.length ?
        '<div class="card">' +
          '<h3>适合你的球拍 · ' + esc(st.name) + ' 同型打法</h3>' +
          '<p class="footnote" style="margin:0 0 11px;text-align:left">按你匹配到的打法类型选，不必照搬球星本人用拍；均为市面在售主流款，版本涂装以当地经销为准</p>' +
          st.rackets.map(function(r){
            return '<div class="racket">' +
              '<div class="rbrand">' + esc(r.brand) + '</div>' +
              '<div><div class="rmodel">' + esc(r.model) + '<span>' + esc(r.spec) + '</span></div>' +
              '<p class="rwhy">' + esc(r.why) + '</p></div>' +
            '</div>';
          }).join("") +
        '</div>' : '') +

        '<div class="card">' +
          '<h3>全部对照球星 · 相对相似度</h3>' +
          '<div class="gallery">' + ranked.map(function(r){
            return '<div class="gcard">' +
              '<div class="art">' + innerArt(r.star, "g") + '</div>' +
              '<div style="min-width:0"><b>' + esc(r.star.name) + '</b><small>' + r.sim + '% · ' + esc(r.star.style) + '</small></div>' +
            '</div>';
          }).join("") + '</div>' +
        '</div>' +

        (isShared ?
        '<div class="actions">' +
          '<button class="btn" id="again">我也要测一次 →</button>' +
        '</div>' +
        '<p class="footnote" style="margin-top:10px">这是朋友分享的结果，答一遍自己的更准</p>' :
        '<div class="actions">' +
          '<button class="btn" id="copy">复制结果</button>' +
          '<button class="btn ghost" id="share" style="flex:none;width:auto;padding:15px 16px">分享链接</button>' +
        '</div>' +
        '<div class="actions" style="margin-top:9px">' +
          '<button class="btn ghost" id="again" style="padding:13px">再测一次</button>' +
        '</div>') +
        '<p class="footnote">测评结果仅供娱乐与自我参照 · 球星数据为按公开打法特点的概括，非官方统计<br>球星照片来自你提供的素材，仅作球风对照示意<br>球拍推荐为按打法类型的选拍建议，非品牌合作或官方装备单</p>' +
      '</section>';

    var fills = app.querySelectorAll(".bfill");
    requestAnimationFrame(function(){
      setTimeout(function(){
        Array.prototype.forEach.call(fills, function(f){ f.style.width = f.getAttribute("data-w") + "%"; });
      }, 60);
    });

    document.getElementById("copy").addEventListener("click", function(){
      var lines = [
        "🏸 我的羽毛球打法测评",
        "球风：" + sname + "（" + top2 + "）",
        "最像的球星：" + st.name + "（" + st.nickname + "）· 相似度 " + best.sim + "%",
        scores.map(function(s){ return s.dim.name + " " + s.grade.key + "(" + s.grade.label + ")"; }).join(" · "),
        "次像：" + second.star.name + " " + second.sim + "% / " + third.star.name + " " + third.sim + "%",
        "—— " + QUESTIONS.length + " 题打法测评"
      ];
      var text = lines.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){ showToast("已复制，去粘贴吧"); }).catch(function(){ fallbackCopy(text); });
      } else { fallbackCopy(text); }
    });

    document.getElementById("again").addEventListener("click", function(){
      state = { idx: 0, answers: new Array(QUESTIONS.length).fill(null), lock: false, timer: null };
      if (window.history && history.replaceState) history.replaceState(null, "", location.pathname);
      renderCover();
    });

    var shareBtn = document.getElementById("share");
    if (shareBtn) shareBtn.addEventListener("click", function(){
      var payload = encodeAnswers(state.answers);
      var url = location.href.split("?")[0] + "?r=" + payload;
      if (navigator.share) {
        navigator.share({ title: "羽毛球打法测评", text: "我的球风最像 " + st.name + "（相似度 " + best.sim + "%），你测测像谁？", url: url })
          .catch(function(){});
        return;
      }
      copyText(url, "分享链接已复制，发给朋友就能看到你的结果");
    });
  }

  function encodeAnswers(arr) {
    var str = "", i;
    for (i = 0; i < arr.length; i++) str += String(arr[i] || 3);
    return encodeURIComponent(btoa(str));
  }
  function decodeAnswers(payload) {
    try {
      var raw = atob(decodeURIComponent(payload));
      if (!/^[1-5]+$/.test(raw) || raw.length !== QUESTIONS.length) return null;
      return raw.split("").map(function(c){ return parseInt(c, 10); });
    } catch (e) { return null; }
  }
  function copyText(text, okMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ showToast(okMsg || "已复制"); }).catch(function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      showToast("已复制，去粘贴吧");
    } catch (e) { showToast("复制失败，手动截图吧"); }
  }

  var sharedPayload = (location.search.match(/[?&]r=([^&]+)/) || [])[1];
  var sharedAnswers = sharedPayload ? decodeAnswers(sharedPayload) : null;
  if (sharedAnswers) {
    state.answers = sharedAnswers;
    renderResult(true);
  } else if (/[?&]demo=1/.test(location.search) || /[?&]demo=\d/.test(location.search)) {
    var m = location.search.match(/demo=(\d)/);
    var target = m ? parseInt(m[1], 10) : Math.floor(Math.random() * 5) + 1;
    for (var i = 0; i < QUESTIONS.length; i++) state.answers[i] = ((i * 7 + target * 3) % 5) + 1;
    renderResult();
  } else {
    renderCover();
  }
})();
</script>
</body>
</html>
